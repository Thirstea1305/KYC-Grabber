[project]
name = "kyc-grabber"
version = "0.1.0"
description = "Email-driven KYC enrichment service: CSV in, multi-sheet Excel out."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
